name: Preview Pull Request

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'yarn.lock'
      - 'nx.json'
      - 'eslint.config.mjs'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'projects/**'

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Name
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feature|refactor|fix)\/[a-z0-9._-]+$ ]]; then
            echo "Invalid branch name: $BRANCH"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn lint:check

  deadcode:
    runs-on: ubuntu-latest
    needs: validate-branch
    outputs:
      report: ${{ steps.deadcode.outputs.report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Dead Code Check
        id: deadcode
        shell: bash
        run: |
          set +e
          yarn check:deadcode --all
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "report=passed" >> "$GITHUB_OUTPUT"
          else
            echo "report=issues found" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  circular:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn check:circular --all

  spell:
    runs-on: ubuntu-latest
    needs: validate-branch
    outputs:
      report: ${{ steps.spell.outputs.report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Spell Check
        id: spell
        shell: bash
        run: |
          set +e
          yarn check:spell --all
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "report=passed" >> "$GITHUB_OUTPUT"
          else
            echo "report=issues found" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  format:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn format:check

  test:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn test --all

  e2e-test:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: yarn test-e2e --all

  build:
    runs-on: ubuntu-latest
    needs: [lint, circular, format, test, e2e-test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build --all

  preview:
    runs-on: ubuntu-latest
    needs: [validate-branch, lint, deadcode, circular, spell, format, test, e2e-test, build]
    if: always()
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comment PR preview
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pr-preview-status -->";
            const pr = context.payload.pull_request;
            const body = `${marker}
            ## ✅ CI Preview

            **Branch:** \`${pr.head.ref}\`  
            **Commit:** \`${pr.head.sha.slice(0, 7)}\`

            | Check | Result |
            |---|---|
            | Validate branch | **${{ needs.validate-branch.result }}** |
            | Lint | **${{ needs.lint.result }}** |
            | Deadcode | **${{ needs.deadcode.outputs.report }}** |
            | Circular | **${{ needs.circular.result }}** |
            | Spell | **${{ needs.spell.outputs.report }}** |
            | Format | **${{ needs.format.result }}** |
            | Test | **${{ needs.test.result }}** |
            | E2E test | **${{ needs['e2e-test'].result }}** |
            | Build | **${{ needs.build.result }}** |

            _Updated: ${new Date().toISOString()}_
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === "Bot" && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
