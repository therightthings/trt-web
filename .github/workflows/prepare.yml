name: Prepare Branch

on:
  push:
    branches:
      - 'feature/**'
      - 'refactor/**'
      - 'fix/**'
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'yarn.lock'
      - 'nx.json'
      - 'eslint.config.mjs'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'projects/**'

concurrency:
  group: prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Name
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ ! "$BRANCH" =~ ^(feature|refactor|fix)\/[a-z0-9._-]+$ ]]; then
            echo "Invalid branch name: $BRANCH"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Lint Check
        run: yarn lint:check

  deadcode:
    runs-on: ubuntu-latest
    needs: validate-branch
    outputs:
      report: ${{ steps.deadcode.outputs.report }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Dead Code Check
        id: deadcode
        shell: bash
        run: |
          set +e
          yarn check:deadcode --all
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "report=passed" >> "$GITHUB_OUTPUT"
          else
            echo "report=issues found" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  circular:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Circular Check
        run: yarn check:circular --all

  spell:
    runs-on: ubuntu-latest
    needs: validate-branch
    outputs:
      report: ${{ steps.spell.outputs.report }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Spell Check
        id: spell
        shell: bash
        run: |
          set +e
          yarn check:spell --all
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "report=passed" >> "$GITHUB_OUTPUT"
          else
            echo "report=issues found" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  format:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Format Check
        run: yarn format:check

  test:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test
        run: yarn test --all

  e2e-test:
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E Test
        run: yarn test-e2e --all

  build:
    runs-on: ubuntu-latest
    needs: [lint, circular, format, test, e2e-test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build
        run: yarn build --all

  summary:
    runs-on: ubuntu-latest
    needs: [validate-branch, lint, deadcode, circular, spell, format, test, e2e-test, build]
    if: always()
    steps:
      - name: Write workflow summary
        run: |
          {
            echo "# Prepare Branch — Summary"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "## Results"
            echo "- Validate branch: **${{ needs.validate-branch.result }}**"
            echo "- Lint: **${{ needs.lint.result }}**"
            echo "- Deadcode: **${{ needs.deadcode.outputs.report }}**"
            echo "- Circular: **${{ needs.circular.result }}**"
            echo "- Spell: **${{ needs.spell.outputs.report }}**"
            echo "- Format: **${{ needs.format.result }}**"
            echo "- Test: **${{ needs.test.result }}**"
            echo "- E2E test: **${{ needs['e2e-test'].result }}**"
            echo "- Build: **${{ needs.build.result }}**"
          } >> "$GITHUB_STEP_SUMMARY"
