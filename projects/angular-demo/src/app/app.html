<div class="min-h-screen bg-base-200 text-base-content">
  <header class="sticky top-0 z-20 border-b border-base-300 bg-base-100/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-5">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div class="space-y-1">
          <p class="text-xs uppercase tracking-[0.3em] text-base-content/60">@trt-web/angular</p>
          <h1
            class="link link-hover text-2xl font-semibold text-base-content"
            routerLink="/"
            routerLinkActive="link-primary"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Angular utilities playground
          </h1>
        </div>
      </div>

      <nav class="flex flex-wrap gap-3">
        @for (group of groups; track group.path) {
        <div
          class="dropdown dropdown-bottom flex-none"
          [class.dropdown-open]="openGroupPath === group.path"
        >
          <button
            class="btn btn-outline btn-sm"
            type="button"
            (click)="toggleGroup(group.path)"
            [attr.aria-expanded]="openGroupPath === group.path"
            [attr.aria-haspopup]="'menu'"
          >
            {{ group.label }}
          </button>

          @if (openGroupPath === group.path) {
          <ul
            tabindex="-1"
            class="dropdown-content menu z-50 mt-2 w-64 rounded-box bg-base-100 p-2 shadow"
          >
            @for (link of group.links; track link.path) {
            <li>
              <button
                type="button"
                class="w-full text-left"
                (click)="navigateToGroup(group.path, link.path)"
              >
                {{ link.label }}
              </button>
            </li>
            }
          </ul>
          }
        </div>
        }
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-6">
    <router-outlet />
  </main>
</div>
