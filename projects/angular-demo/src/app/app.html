<div class="min-h-screen text-slate-900">
  <header class="border-b border-slate-200">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-5">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div class="space-y-1">
          <p class="text-xs uppercase tracking-[0.3em] text-slate-500">@trt-web/angular</p>
          <h1
            class="text-2xl font-semibold text-slate-950 cursor-pointer"
            routerLink="/"
            routerLinkActive="border-slate-500 text-slate-950"
            [routerLinkActiveOptions]="{ exact: true }"
            value="home"
          >
            Angular utilities playground
          </h1>
        </div>
      </div>

      <nav ngMenuBar class="">
        @for (group of groups; track group.path) {
        <div class="relative flex-none">
          <button ngMenuTrigger class="menu-bar-item" type="button" [menu]="groupMenu">
            {{ group.label }}
          </button>

          <div
            ngMenu
            #groupMenu="ngMenu"
            class="menu-panel"
            (itemSelected)="navigateToGroup(group.path, $event)"
          >
            <ng-template ngMenuContent>
              @for (link of group.links; track link.path) {
              <button ngMenuItem type="button" class="menu-panel-item" [value]="link.path">
                {{ link.label }}
              </button>
              }
            </ng-template>
          </div>
        </div>
        }
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-6">
    <router-outlet />
  </main>
</div>
